# nginx of the frontend image — docs/devops/docker.md, ADR-0032.
# Serves the Angular build and proxies /api to the API container, so the app and the API share one
# origin (cookies SameSite=Strict, no CORS, ADR-0001).

# Docker's DNS: the API address is resolved at each request, so nginx starts before the API and keeps
# working when the API container is recreated with a new address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API --------------------------------------------------------------------------------------
    location ^~ /api/ {
        # A variable makes nginx resolve "api" through the resolver above.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Requests are small JSON documents; uploads (attachments) will raise this on their own route.
        client_max_body_size 1m;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- App --------------------------------------------------------------------------------------
    # Files with a content hash in their name (main-KR3TOMMA.js, media/roboto-…woff2) never change.
    location ~* "-[A-Z0-9_-]{8}\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Icons keep their names across releases: cached for a day.
    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Other files (favicon, licenses): served if they exist, 404 otherwise — a missing script must not
    # receive index.html.
    location ~ "\.[A-Za-z0-9]+$" {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Every other path is a route of the app: index.html, never cached, so a new release is picked up
    # at the next visit.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
